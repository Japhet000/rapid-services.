<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration des paiements — Rapid Services</title><style>body{font:15px system-ui,Arial;background:#f3f6fb;color:#1d2b3a;margin:0;padding:20px}.box{max-width:1100px;margin:20px auto;background:#fff;padding:22px;border-radius:14px;border:1px solid #e3eaf2}input,textarea{padding:10px;border:1px solid #dce4ed;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0}button{padding:9px 12px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.primary{background:#2368e8;color:white}.ok{background:#15966a;color:white}.no{background:#fff0f0;color:#b43e3e}.muted{color:#718096}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e3eaf2;font-size:13px}td{overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none!important}</style></head><body><div class="box"><h1>Rapid Services — Administration des paiements</h1><p class="muted">Accès réservé au fondateur. Configurez ADMIN_SECRET dans les variables d’environnement Render.</p><label>Code administrateur</label><input id="secret" type="password" autocomplete="current-password"><button class="primary" id="load">Afficher les paiements</button> <button id="refresh">Actualiser</button><p id="message" class="muted" role="status"></p></div><div class="box"><div class="tablebox"><table><thead><tr><th>Date</th><th>Entreprise / propriétaire</th><th>Formule</th><th>Moyen</th><th>Montant</th><th>Référence / TXID</th><th>Statut</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8">Connectez-vous pour afficher les paiements.</td></tr></tbody></table></div></div><script>const PLAN_LABELS={month1:'1 mois',month3:'3 mois',month6:'6 mois',year1:'1 an'};const $=id=>document.getElementById(id);let secret=sessionStorage.getItem('rs_admin_secret')||'';$('secret').value=secret;async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','x-admin-secret':secret,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}async function load(){secret=$('secret').value.trim();sessionStorage.setItem('rs_admin_secret',secret);$('message').textContent='Chargement…';try{const d=await api('/api/admin/payments');$('rows').innerHTML=d.payments.length?d.payments.map(p=>`<tr><td>${new Date(p.created_at).toLocaleString('fr-FR')}</td><td><b>${esc(p.business_name)}</b><br>${esc(p.owner_name||'')}<br>${esc(p.owner_email||'')}</td><td>${esc(p.plan)}</td><td>${esc(p.method)}</td><td>${p.method==='usdt_bep20'?Number(p.amount_usd).toFixed(2)+' USDT':Number(p.amount_bif).toLocaleString('fr-FR')+' BIF'}</td><td>${esc(p.reference)}<br>${esc(p.sender_phone||'')}</td><td>${esc(p.status)}</td><td>${p.status==='pending'?`<div class="actions"><button class="ok" onclick="review(${p.id},'approved','${esc(p.plan)}')">Approuver</button><button class="no" onclick="review(${p.id},'rejected','${esc(p.plan)}')">Refuser</button></div>`:esc(p.admin_note||'Traité')}</td></tr>`).join(''):'<tr><td colspan="8">Aucun paiement.</td></tr>';$('message').textContent=d.payments.length+' paiement(s) chargé(s).'}catch(e){$('message').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function review(id,decision,plan){const duration=PLAN_LABELS[plan]||plan;let note=prompt(decision==='approved'?'Note facultative (ex. vérifié sur le compte marchand)':'Motif du refus (recommandé)');if(note===null)return;note=note.trim();if(decision==='rejected'&&!note){$('message').textContent='Veuillez indiquer le motif du refus.';return}const question=decision==='approved'?`Confirmer ce paiement ? L’abonnement sera activé pour ${duration}.`:'Confirmer le refus de ce paiement ?';if(!confirm(question))return;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);$('message').textContent='Traitement du paiement…';try{const d=await api('/api/admin/payments/'+id+'/review',{method:'POST',body:JSON.stringify({decision,note})});$('message').textContent=d.message;await load()}catch(e){$('message').textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}}$('load').onclick=load;$('refresh').onclick=load;if(secret)load();</script></body></html>
